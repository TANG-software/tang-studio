<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TANG Studio — Video editor with auto captions</title>
<style>
:root{
  --bg:#0f1014; --panel:#16181f; --panel2:#1d2029; --line:#2a2e3a;
  --text:#e9ecf1; --dim:#8b93a3; --accent:#6c5ce7; --accent2:#a29bfe;
  --gold:#e6c96a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.projname{background:transparent;border:1px solid transparent;color:var(--text);font:inherit;padding:5px 9px;border-radius:8px;min-width:160px}
.projname:hover{border-color:var(--line)}
.projname:focus{outline:none;border-color:var(--accent);background:var(--panel2)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;padding:9px 15px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:#3b4152}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}

.main{flex:1;display:flex;min-height:0}
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.left{width:250px;border-right:1px solid var(--line);flex-shrink:0}
.right{width:320px;border-left:1px solid var(--line);flex-shrink:0}
.panel-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:12px}

/* ---------- media library ---------- */
.import{border:1.5px dashed var(--line);border-radius:12px;padding:20px 12px;text-align:center;color:var(--dim);cursor:pointer;margin-bottom:12px}
.import:hover{border-color:var(--accent);color:var(--text)}
.media-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;margin-bottom:6px;border:1px solid transparent}
.media-item:hover{background:var(--panel2)}
.media-item.active{background:var(--panel2);border-color:var(--accent)}
.thumb{width:56px;height:36px;border-radius:6px;background:#000;object-fit:cover;flex-shrink:0}
.media-meta{min-width:0;flex:1}
.media-meta b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-meta span{font-size:11px;color:var(--dim)}

/* ---------- preview ---------- */
.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:#0a0b0e}
.preview-wrap{flex:1;display:grid;place-items:center;padding:18px;min-height:0}
.preview{position:relative;max-width:100%;max-height:100%;background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center}
video,img.preview-media{max-width:100%;max-height:100%;display:block}
.empty-hint{color:var(--dim);text-align:center;padding:40px;font-size:13px}
.caption-overlay{position:absolute;left:0;right:0;bottom:8%;text-align:center;padding:0 6%;pointer-events:none}
.caption-overlay span{display:inline-block;background:rgba(0,0,0,.72);color:#fff;padding:6px 14px;border-radius:8px;font-size:clamp(13px,1.6vw,20px);font-weight:600;line-height:1.35}
.transport{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line);background:var(--panel);flex-shrink:0}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px}
.tbtn:hover{border-color:var(--accent)}
.timecode{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}

/* ---------- timeline ---------- */
.timeline{height:170px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;flex-shrink:0}
.tl-head{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.tl-body{flex:1;overflow-x:auto;overflow-y:hidden;padding:10px 14px;position:relative}
.ruler{height:18px;position:relative;color:var(--dim);font-size:10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.ruler i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding-left:3px;font-style:normal}
.track{height:56px;position:relative;background:var(--panel2);border-radius:8px;min-width:100%}
.clip{position:absolute;top:0;bottom:0;background:linear-gradient(135deg,#3a2f6e,#54479c);border:1px solid var(--accent2);border-radius:8px;overflow:hidden;cursor:grab;display:flex;align-items:center;padding:0 8px;font-size:11px;white-space:nowrap;text-overflow:ellipsis}
.clip .handle{position:absolute;top:0;bottom:0;width:8px;background:rgba(255,255,255,.25);cursor:ew-resize}
.clip .handle.l{left:0;border-radius:8px 0 0 8px}
.clip .handle.r{right:0;border-radius:0 8px 8px 0}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none;z-index:5}

/* ---------- captions ---------- */
.cap-toolbar{display:flex;gap:8px;margin-bottom:12px}
.cap-toolbar .btn{flex:1;justify-content:center;font-size:13px;padding:10px}
.cap-list{display:flex;flex-direction:column;gap:8px}
.cap-row{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
.cap-row.active{border-color:var(--gold)}
.cap-time{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-bottom:5px;display:flex;justify-content:space-between}
.cap-text{width:100%;background:transparent;border:0;color:var(--text);font:inherit;font-size:13px;line-height:1.45;resize:vertical;min-height:34px;outline:none;padding:2px}
.cap-text:focus{background:rgba(255,255,255,.04);border-radius:6px}
.hint{color:var(--dim);font-size:12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22262f;border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.show{opacity:1}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> TANG Studio</div>
    <input class="projname" id="projName" value="Untitled project" aria-label="Project name">
    <div class="spacer"></div>
    <button class="btn ghost" id="exportBtn">Export captions (.srt)</button>
    <button class="btn primary" id="exportVideoBtn">Export video</button>
  </header>

  <div class="main">
    <!-- media library -->
    <aside class="panel left">
      <div class="panel-head">Your media</div>
      <div class="panel-body">
        <div class="import" id="importZone">
          <div style="font-size:22px;margin-bottom:6px">+</div>
          <b>Import media</b>
          <div style="font-size:11.5px;margin-top:4px">Video, audio or image</div>
        </div>
        <input type="file" id="fileInput" accept="video/*,audio/*,image/*" multiple hidden>
        <div id="mediaList"></div>
      </div>
    </aside>

    <!-- preview -->
    <section class="stage">
      <div class="preview-wrap">
        <div class="preview" id="preview">
          <div class="empty-hint" id="emptyHint">
            Import a video to begin.<br>Then use <b>Auto Caption</b> to transcribe it.
          </div>
          <video id="video" hidden playsinline></video>
          <img id="previewImg" class="preview-media" hidden alt="">
          <div class="caption-overlay" id="capOverlay" hidden><span></span></div>
        </div>
      </div>
      <div class="transport">
        <button class="tbtn" id="playBtn" aria-label="Play">▶</button>
        <span class="timecode" id="timecode">00:00.0 / 00:00.0</span>
        <div class="spacer"></div>
        <span class="hint" id="statusHint"></span>
      </div>
    </section>

    <!-- properties / captions -->
    <aside class="panel right">
      <div class="panel-head">Captions</div>
      <div class="panel-body">
        <div class="cap-toolbar">
          <button class="btn primary" id="autoCaptionBtn">Auto Caption</button>
          <button class="btn" id="clearCapsBtn" title="Remove all captions">Clear</button>
        </div>
        <p class="hint" id="capHint">Auto Caption transcribes the selected clip and puts every line here, so you can fix any word before exporting.</p>
        <div class="cap-list" id="capList"></div>
      </div>
    </aside>
  </div>

  <!-- timeline -->
  <div class="timeline">
    <div class="tl-head">
      <b style="font-size:13px">Timeline</b>
      <span class="hint" id="tlHint">No clip on the timeline</span>
      <div class="spacer"></div>
      <button class="btn ghost" id="splitBtn" title="Split at playhead">Split</button>
      <button class="btn ghost" id="deleteClipBtn" title="Remove clip">Delete</button>
    </div>
    <div class="tl-body">
      <div class="ruler" id="ruler"></div>
      <div class="track" id="track">
        <div class="clip" id="clip" hidden>
          <div class="handle l" id="handleL"></div>
          <span id="clipLabel"></span>
          <div class="handle r" id="handleR"></div>
        </div>
        <div class="playhead" id="playhead" style="left:0"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
